<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flags & Capitals Trivia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-box">
  <div class="score">Score: <span id="score">0</span></div>

  <!-- The flag will be shown here as a big emoji -->
  <div class="flag" id="flag"></div>

  <!-- This will hold the question text, e.g. "What is the capital of this country?" -->
  <div class="question-text" id="question-text"></div>

  <!-- The 4 answer buttons will go here -->
  <div class="choices" id="choices"></div>

  <button class="next-btn" id="next-btn">Next Question →</button>
</div>

</body>
</html>
