<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flags & Capitals Trivia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-box">
  <div class="score">Score: <span id="score">0</span></div>
  
  
  <div class="total-questions">Total questions: <span id="total-questions">0</span></div>


  <!-- This will hold the question text, e.g. "What is the capital of this country?" -->
  <div class="question-text" id="question-text"></div>

  <!-- The 5 answer buttons will go here -->
  <div class="choices" id="choices"></div>

  <button class="next-btn" id="next-btn">Next Question →</button>
</div>

<!-- "defer" makes the browser wait for the HTML to finish loading before running this script,
     so document.getElementById() calls below are guaranteed to find their elements -->
<script src="script.js" defer></script>

</body>
</html>
